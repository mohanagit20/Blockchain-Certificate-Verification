<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CertiChain | Certificate Verification</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #0F172A;
            color: #F8FAFC;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            border-radius: 16px;
            background: #6366F1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        h1 {
            text-align: center;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .brand {
            color: #818CF8;
        }

        .subtitle {
            text-align: center;
            color: #94A3B8;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .status {
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 25px;
        }

        .genuine {
            background: rgba(34, 197, 94, 0.12);
            border: 1px solid #22C55E;
        }

        .tampered {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid #EF4444;
        }

        .status-icon {
            font-size: 50px;
            margin-bottom: 12px;
        }

        .status-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .genuine .status-title {
            color: #4ADE80;
        }

        .tampered .status-title {
            color: #F87171;
        }

        .details {
            background: #0F172A;
            border-radius: 12px;
            padding: 20px;
        }

        .detail-row {
            padding: 12px 0;
            border-bottom: 1px solid #334155;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .label {
            color: #94A3B8;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .value {
            color: #F8FAFC;
            word-break: break-all;
            font-size: 14px;
        }

        .method {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(99, 102, 241, 0.12);
            border: 1px solid #6366F1;
            color: #C7D2FE;
            text-align: center;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #64748B;
            font-size: 12px;
        }

        .loading {
            text-align: center;
            color: #94A3B8;
            font-size: 17px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">🔐</div>

    <h1>
        <span class="brand">CertiChain</span>
        Verification
    </h1>

    <p class="subtitle">
        Blockchain-based academic certificate authenticity verification
    </p>

    <div id="result">
        <div class="loading">
            ⏳ Verifying certificate...
        </div>
    </div>

    <div class="method">
        🔗 Verification powered by Blockchain + SHA-256
    </div>

    <div class="footer">
        🔒 Secure • Tamper Detection • Blockchain Verified
    </div>

</div>

<script>

const params = new URLSearchParams(window.location.search);
const hash = params.get("hash");

const result = document.getElementById("result");

if (!hash) {

    result.innerHTML = `
        <div class="status tampered">
            <div class="status-icon">❌</div>
            <div class="status-title">
                No Certificate Hash Found
            </div>
            <p>
                A valid certificate verification hash
                was not provided.
            </p>
        </div>
    `;

} else {

    fetch(
        "http://localhost:5000/verify?hash="
        + encodeURIComponent(hash)
    )
    .then(response => response.json())
    .then(data => {

        if (data.verified) {

            result.innerHTML = `
                <div class="status genuine">

                    <div class="status-icon">✅</div>

                    <div class="status-title">
                        Certificate is Genuine
                    </div>

                    <p>
                        The certificate hash matches
                        the record stored on the blockchain.
                    </p>

                </div>

                <div class="details">

                    <div class="detail-row">
                        <div class="label">
                            Verification Status
                        </div>

                        <div class="value">
                            ✅ Genuine
                        </div>
                    </div>

                    <div class="detail-row">
                        <div class="label">
                            Verification Method
                        </div>

                        <div class="value">
                            SHA-256 Hash + Blockchain
                        </div>
                    </div>

                    <div class="detail-row">
                        <div class="label">
                            Certificate Hash
                        </div>

                        <div class="value">
                            ${hash}
                        </div>
                    </div>

                    <div class="detail-row">
                        <div class="label">
                            Verification Time
                        </div>

                        <div class="value">
                            ${new Date().toLocaleString()}
                        </div>
                    </div>

                </div>
            `;

        } else {

            result.innerHTML = `
                <div class="status tampered">

                    <div class="status-icon">❌</div>

                    <div class="status-title">
                        Certificate is Invalid
                    </div>

                    <p>
                        The certificate hash does not
                        match any blockchain record.
                    </p>

                </div>

                <div class="details">

                    <div class="detail-row">

                        <div class="label">
                            Verification Status
                        </div>

                        <div class="value">
                            ❌ Invalid / Tampered
                        </div>

                    </div>

                    <div class="detail-row">

                        <div class="label">
                            Submitted Hash
                        </div>

                        <div class="value">
                            ${hash}
                        </div>

                    </div>

                </div>
            `;
        }

    })
    .catch(error => {

        result.innerHTML = `
            <div class="status tampered">

                <div class="status-icon">⚠️</div>

                <div class="status-title">
                    Verification Unavailable
                </div>

                <p>
                    Unable to connect to the verification server.
                </p>

            </div>
        `;

    });
}

</script>

</body>
</html>
