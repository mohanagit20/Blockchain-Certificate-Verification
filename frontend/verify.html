<!DOCTYPE html>
<html>
<head>
    <title>Certificate Verification</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 30px 15px;
            color: #1f2937;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            font-size: 42px;
        }

        .header h1 {
            margin: 8px 0;
        }

        .header p {
            color: #6b7280;
            margin: 0;
        }

        .container {
            width: 100%;
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }

        .status-card {
            padding: 25px;
            border-radius: 14px;
            margin-bottom: 25px;
        }

        .genuine-card {
            background: #ecfdf5;
            border: 1px solid #86efac;
        }

        .tampered-card {
            background: #fef2f2;
            border: 1px solid #fca5a5;
        }

        .badge {
            display: inline-block;
            padding: 9px 18px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
        }

        .green-badge {
            background: #dcfce7;
            color: #166534;
        }

        .red-badge {
            background: #fee2e2;
            color: #991b1b;
        }

        #status {
            font-size: 26px;
            font-weight: bold;
            margin: 15px 0 5px;
        }

        .genuine {
            color: #15803d;
        }

        .tampered {
            color: #dc2626;
        }

        .details {
            margin-top: 25px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 15px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .detail-label {
            font-weight: bold;
        }

        .detail-value {
            text-align: right;
            color: #4b5563;
        }

        .hash-box {
            margin-top: 10px;
            background: #f3f4f6;
            padding: 15px;
            border-radius: 10px;
            word-break: break-all;
            text-align: left;
            font-family: monospace;
            font-size: 13px;
            color: #374151;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #6b7280;
            font-size: 13px;
        }

        .error {
            text-align: center;
            color: #dc2626;
            font-weight: bold;
        }

        @media (max-width: 600px) {

            .container {
                padding: 25px 20px;
            }

            .detail-row {
                flex-direction: column;
                gap: 5px;
            }

            .detail-value {
                text-align: left;
            }
        }
    </style>
</head>

<body>

<div class="header">

    <div class="logo">🎓</div>

    <h1>Certificate Verification</h1>

    <p>
        Blockchain-Based Academic Certificate Verification System
    </p>

</div>

<div class="container">

    <div id="result">
        Checking certificate...
    </div>

</div>

<div class="footer">
    Secure Digital Certificate Verification
</div>


<script>

    const params = new URLSearchParams(window.location.search);
    const hash = params.get("hash");

    const result = document.getElementById("result");

    const verificationTime = new Date().toLocaleString();


    if (!hash) {

        result.innerHTML = `
            <p class="error">
                ❌ No certificate hash found.
            </p>
        `;

    } else {

        fetch(
            "http://localhost:5000/verify?hash="
            + encodeURIComponent(hash)
        )

        .then(response => response.json())

        .then(data => {

            if (data.verified) {

                result.innerHTML = `

                    <div class="status-card genuine-card">

                        <span class="badge green-badge">
                            ✓ CERTIFICATE VERIFIED
                        </span>

                        <div id="status" class="genuine">
                            Certificate is Genuine
                        </div>

                        <p>
                            The certificate hash matches the
                            registered certificate record.
                        </p>

                    </div>


                    <div class="details">

                        <div class="detail-row">

                            <span class="detail-label">
                                Verification Status
                            </span>

                            <span class="detail-value">
                                ✅ Genuine
                            </span>

                        </div>


                        <div class="detail-row">

                            <span class="detail-label">
                                Verification Method
                            </span>

                            <span class="detail-value">
                                SHA-256 Hash Verification
                            </span>

                        </div>


                        <div class="detail-row">

                            <span class="detail-label">
                                Verification Time
                            </span>

                            <span class="detail-value">
                                ${verificationTime}
                            </span>

                        </div>


                        <div style="margin-top: 20px;">

                            <strong>
                                Certificate Hash
                            </strong>

                            <div class="hash-box">
                                ${hash}
                            </div>

                        </div>

                    </div>
                `;

            } else {

                result.innerHTML = `

                    <div class="status-card tampered-card">

                        <span class="badge red-badge">
                            ✗ VERIFICATION FAILED
                        </span>

                        <div id="status" class="tampered">
                            Certificate is Tampered or Invalid
                        </div>

                        <p>
                            The certificate hash does not match
                            the registered certificate record.
                        </p>

                    </div>


                    <div class="details">

                        <div class="detail-row">

                            <span class="detail-label">
                                Verification Status
                            </span>

                            <span class="detail-value">
                                ❌ Invalid
                            </span>

                        </div>


                        <div class="detail-row">

                            <span class="detail-label">
                                Verification Method
                            </span>

                            <span class="detail-value">
                                SHA-256 Hash Verification
                            </span>

                        </div>


                        <div class="detail-row">

                            <span class="detail-label">
                                Verification Time
                            </span>

                            <span class="detail-value">
                                ${verificationTime}
                            </span>

                        </div>


                        <div style="margin-top: 20px;">

                            <strong>
                                Certificate Hash
                            </strong>

                            <div class="hash-box">
                                ${hash}
                            </div>

                        </div>

                    </div>
                `;
            }

        })

        .catch(error => {

            result.innerHTML = `
                <p class="error">
                    ❌ Unable to connect to verification server.
                </p>
            `;

            console.error(error);

        });

    }

</script>

</body>
</html>
